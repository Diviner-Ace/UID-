name: Build Zygisk Module

on:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.10'

      - name: Setup Android NDK
        run: |
          # 设置 SDK 根目录
          echo "ANDROID_SDK_ROOT=/usr/local/lib/android/sdk" >> $GITHUB_ENV
          echo "ANDROID_HOME=/usr/local/lib/android/sdk" >> $GITHUB_ENV
          
          # 安装 NDK
          echo "y" | /usr/local/lib/android/sdk/cmdline-tools/latest/bin/sdkmanager --install "ndk;27.3.13750724"
          
          echo "ANDROID_NDK_HOME=/usr/local/lib/android/sdk/ndk/27.3.13750724" >> $GITHUB_ENV

      - name: Patch build.py for Linux
        run: |
          # 1. 将 windows-x86_64 替换为 linux-x86_64
          sed -i 's/windows-x86_64/linux-x86_64/g' tools/uid-seccomp-module/build.py
          # 2. 去掉 clang++ 和 llvm-readelf 后面的 .exe 后缀
          sed -i 's/clang++\.exe/clang++/g' tools/uid-seccomp-module/build.py
          sed -i 's/llvm-readelf\.exe/llvm-readelf/g' tools/uid-seccomp-module/build.py

      - name: Build Module
        run: python tools/uid-seccomp-module/build.py --module-only

      - name: Upload Artifact
        uses: actions/upload-artifact@v4
        with:
          name: cq-uid-seccomp-module
          path: build/0.2.8/*.zip