name: Build Zygisk Module

on:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.10'

      - name: Setup Android NDK
        run: |
          # 1. 定义标准路径并写入环境变量
          echo "ANDROID_SDK_ROOT=$HOME/.android/sdk" >> $GITHUB_ENV
          echo "ANDROID_HOME=$HOME/.android/sdk" >> $GITHUB_ENV
          
          # 2. 使用 sdkmanager 安装指定版本的 NDK
          echo "y" | $HOME/.android/sdk/cmdline-tools/latest/bin/sdkmanager --install "ndk;27.3.13750724"
          
          # 3. 严格按 README 要求，把 NDK 根目录指向 ANDROID_NDK_HOME
          echo "ANDROID_NDK_HOME=$HOME/.android/sdk/ndk/27.3.13750724" >> $GITHUB_ENV

      - name: Build Module
        run: python tools/uid-seccomp-module/build.py --module-only

      - name: Upload Artifact
        uses: actions/upload-artifact@v4
        with:
          name: cq-uid-seccomp-module
          path: build/0.2.7/*.zip